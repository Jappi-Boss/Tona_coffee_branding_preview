name: Bootstrap branding preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-branding-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4

      - name: Copy verified branding snapshot
        env:
          SOURCE_SHA: 347617c4d17b5b3f7c9e6c44278afa3422dc1fd4
        run: |
          git clone https://github.com/Jappi-Boss/Tona_coffee.git "$RUNNER_TEMP/tona-source"
          git -C "$RUNNER_TEMP/tona-source" checkout "$SOURCE_SHA"
          rsync -a --exclude='.git/' "$RUNNER_TEMP/tona-source/" ./
          git config user.name "Tona Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Branding snapshot is already synchronized."
            exit 0
          fi
          git commit -m "Initialize Tona branding preview"
          git push origin HEAD:main
